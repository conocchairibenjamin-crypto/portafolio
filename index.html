<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETEX | Tienda Oficial</title>
    <!-- Tailwind CSS para diseño robusto y profesional (Evita pantallas en blanco) -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para asegurar el cursor y la estética minimalista estilo Wess */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            cursor: default !important;
            background-color: #ffffff;
            color: #111111;
        }
        /* Barra de navegación flotante fija */
        .nav-flotante {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #eaeaea;
        }
    </style>
</head>
<body class="pt-20">

    <!-- REPRODUCTOR DE MÚSICA (Opcional, en silencio por defecto) -->
    <audio id="musicaFondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- BARRA SUPERIOR FLOTANTE ESTILO WESS -->
    <nav class="nav-flotante px-6 py-4 flex justify-between items-center">
        <!-- Izquierda: Menú y Buscador -->
        <div class="flex gap-6 text-xs uppercase tracking-widest font-medium">
            <button onclick="alternarMenu()" class="hover:opacity-60 transition">Menú</button>
            <button onclick="enfocarBuscador()" class="hover:opacity-60 transition">Buscar</button>
        </div>

        <!-- Centro: Logotipo de la Marca -->
        <div class="text-xl font-bold tracking-[0.3em] uppercase">
            <a href="#">DETEX</a>
        </div>

        <!-- Derecha: Acceso y Carrito -->
        <div class="flex gap-6 text-xs uppercase tracking-widest font-medium">
            <a href="#" class="hover:opacity-60 transition">Acceso</a>
            <button onclick="verCarrito()" class="hover:opacity-60 transition flex items-center gap-1">
                Carrito (<span id="contador-cart">0</span>)
            </button>
        </div>
    </nav>

    <!-- BANNER HERO PRINCIPAL -->
    <header class="relative w-full h-[60vh] bg-neutral-900 flex flex-col justify-center items-center text-center text-white px-4 overflow-hidden mb-12">
        <div class="absolute inset-0 bg-black/40 z-10"></div>
        <div class="relative z-20">
            <p class="text-xs uppercase tracking-[0.4em] mb-3 opacity-80">Detex Mayorista</p>
            <h1 class="text-3xl md:text-5xl font-light tracking-[0.2em] uppercase mb-6">Colección 2026</h1>
            <a href="#catalogo" class="border border-white px-8 py-3 text-xs uppercase tracking-widest hover:bg-white hover:text-black transition duration-300">Ver Catálogo</a>
        </div>
    </header>

    <!-- BARRA DE BÚSQUEDA Y FILTROS -->
    <section class="max-w-7xl mx-auto px-6 mb-8">
        <div class="w-full md:w-1/3 relative">
            <input type="text" id="buscadorInput" onkeyup="filtrarProductos()" placeholder="BUSCAR PRENDA..." class="w-full border-b border-neutral-300 py-2 text-xs uppercase tracking-widest focus:outline-none focus:border-black transition">
        </div>
    </section>

    <!-- SECCIÓN DE CATÁLOGO DE PRODUCTOS -->
    <main id="catalogo" class="max-w-7xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-12 mb-24">
        
        <!-- Producto 1 (Remera Corte Japonés) -->
        <div class="producto-card group flex flex-col" data-nombre="remera corte japones estampada chica">
            <div class="bg-neutral-100 aspect-[3/4] overflow-hidden mb-4 relative">
                <!-- Reemplazar src con la URL de tu imagen real cuando la tengas -->
                <div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs uppercase tracking-wider bg-neutral-100 group-hover:scale-105 transition duration-500">Imagen Prenda</div>
                <button onclick="agregarAlCarrito('Remera Corte Japonés', 8500)" class="absolute bottom-4 left-4 right-4 bg-black text-white text-xs uppercase tracking-widest py-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    Añadir
                </button>
            </div>
            <h3 class="text-xs uppercase tracking-wider font-medium mb-1">Remera Corte Japonés</h3>
            <p class="text-xs text-neutral-500 uppercase tracking-widest mb-1">Estampada - Chica</p>
            <p class="text-xs font-semibold tracking-wider">$8.500</p>
        </div>

        <!-- Producto 2 (Campera Boxy) -->
        <div class="producto-card group flex flex-col" data-nombre="campera boxy diseño cierre cordoba hombre">
            <div class="bg-neutral-100 aspect-[3/4] overflow-hidden mb-4 relative">
                <div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs uppercase tracking-wider bg-neutral-100 group-hover:scale-105 transition duration-500">Imagen Prenda</div>
                <button onclick="agregarAlCarrito('Campera Boxy Cierre', 24000)" class="absolute bottom-4 left-4 right-4 bg-black text-white text-xs uppercase tracking-widest py-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    Añadir
                </button>
            </div>
            <h3 class="text-xs uppercase tracking-wider font-medium mb-1">Campera Boxy Cierre</h3>
            <p class="text-xs text-neutral-500 uppercase tracking-widest mb-1">Diseño Córdoba - Hombre</p>
            <p class="text-xs font-semibold tracking-wider">$24.000</p>
        </div>

        <!-- Producto 3 (Pantalón Gym) -->
        <div class="producto-card group flex flex-col" data-nombre="pantalon gym deportivo rústico">
            <div class="bg-neutral-100 aspect-[3/4] overflow-hidden mb-4 relative">
                <div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs uppercase tracking-wider bg-neutral-100 group-hover:scale-105 transition duration-500">Imagen Prenda</div>
                <button onclick="agregarAlCarrito('Pantalón Gym', 14500)" class="absolute bottom-4 left-4 right-4 bg-black text-white text-xs uppercase tracking-widest py-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    Añadir
                </button>
            </div>
            <h3 class="text-xs uppercase tracking-wider font-medium mb-1">Pantalón Gym</h3>
            <p class="text-xs text-neutral-500 uppercase tracking-widest mb-1">Deportivo - Rústico</p>
            <p class="text-xs font-semibold tracking-wider">$14.500</p>
        </div>

    </main>

    <!-- FUNCIONES INTELIGENTES (JAVASCRIPT) -->
    <script>
        let carritoCount = 0;

        // Función del buscador
        function filtrarProductos() {
            const input = document.getElementById('buscadorInput').value.toLowerCase();
            const productos = document.querySelectorAll('.producto-card');
            
            productos.forEach(producto => {
                const nombreProducto = producto.getAttribute('data-nombre');
                if (nombreProducto.includes(input)) {
                    producto.style.display = "flex";
                } else {
                    producto.style.display = "none";
                }
            });
        }

        // Foco automático en el buscador
        function enfocarBuscador() {
            const input = document.getElementById('buscadorInput');
            input.focus();
            input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Funciones del Carrito
        function agregarAlCarrito(nombre, precio) {
            carritoCount++;
            document.getElementById('contador-cart').innerText = carritoCount;
            alert(`Añadiste: ${nombre} al carrito.`);
        }

        function verCarrito() {
            alert(`Tenés ${carritoCount} artículos en tu carrito.`);
        }

        function alternarMenu() {
            alert("Menú de categorías en desarrollo.");
        }
    </script>
</body>
</html>
