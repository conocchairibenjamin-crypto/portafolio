<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO - Centro de Operaciones Premium</title>
    <style>
        /* CONFIGURACIÓN Y COLORES CORE (DIAMANTE PREMIUM) */
        :root {
            --bg-main: #020617;
            --bg-card: #0b1329;
            --bg-input: #1c2541;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-h: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* PERSONALIZACIÓN DE SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        /* HEADER PREMIUM */
        header {
            background: rgba(2, 6, 23, 0.85);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan);
            border-radius: 3px;
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-cyan);
        }

        .cart-trigger {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .cart-trigger:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .badge {
            background: var(--accent-cyan);
            color: var(--bg-main);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* SECCIÓN HERO (PORTADA IMPACTANTE) */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
            position: relative;
        }

        .hero-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(112,0,255,0.15) 0%, transparent 70%);
            z-index: -1;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 32px auto;
            line-height: 1.5;
        }

        /* SEARCH BAR INTERACTIVA */
        .search-container {
            max-width: 500px;
            margin: 0 auto 48px auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        /* METRICAS / ESTADISTICAS */
        .metrics-grid {
            max-width: 1200px;
            margin: 0 auto 48px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            text-align: left;
        }

        .metric-card h3 {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .metric-card .value {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }

        .metric-card .trend {
            font-size: 12px;
            color: #10b981;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* FILTROS Y CONTENEDOR DE PRODUCTOS */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 80px 24px;
            flex-grow: 1;
            width: 100%;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
        }

        .product-card {
            background: linear-gradient(180deg, var(--bg-card) 0%, rgba(11,19,41,0.5) 100%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-visual {
            background: #020617;
            height: 140px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .product-tag {
            position: absolute;
            top: 36px;
            left: 36px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price {
            font-size: 24px;
            font-weight: 900;
            font-family: monospace;
        }

        .btn-add {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover {
            background: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        /* PANEL LATERAL DE PANEL / CHECKOUT */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--bg-card);
            border-l: 1px solid var(--border-color);
