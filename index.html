<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETEX — Official Urban Store</title>
    <style>
        @import url('https://googleapis.com');
        
        /* ESTILO LIMPIO Y NATIVO - RATÓN TRADICIONAL LIBRE DE ERRORES */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; color: #000000; overflow-x: hidden; }

        /* HEADER SUPERIOR MINIMALISTA */
        header { border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; background: #ffffff; z-index: 100; }
        .top-banner { background: #000000; color: #ffffff; text-align: center; padding: 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; max-width: 1400px; margin: 0 auto; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links li button { background: none; border: none; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; color: #000; }
        .nav-links li button:hover { color: #888; }
        
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; text-decoration: none; color: #000; }
        .logo span { color: #ff4500; }

        /* BANNER PRINCIPAL (ESTILO DOCTA) */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 40px 4%; }
        .hero-banner { width: 100%; position: relative; margin-bottom: 40px; }
        .hero-banner img { width: 100%; height: auto; display: block; border-radius: 4px; }

        /* SECCIÓN DE CUADRADOS DE CATEGORÍAS */
        .section-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 30px; color: #111; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 60px; }
        
        .category-card { background: #f4f4f4; position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; cursor: pointer; border: 1px solid #eaeaea; transition: 0.3s; }
        .category-card:hover { transform: scale(1.02); border-color: #000; }
        .category-bg-text { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; z-index: 2; color: #000; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .category-subtitle { position: absolute; bottom: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #666; z-index: 2; }

        /* SECCIÓN TRIPLE INFO INFERIOR */
        .info-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; border-top: 1px solid #eee; padding-top: 40px; margin-top: 40px; text-align: center; }
        .info-box h4 { font-size: 0.85rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .info-box p { font-size: 0.75rem; color: #666; line-height: 1.5; }

        /* VISTA DEL CATÁLOGO INTERNO (OCULTO POR DEFECTO) */
        .catalog-view { display: none; margin-top: 20px; }
        .catalog-view.active { display: block; }
        .back-btn { background: #000; color: #fff; border: none; padding: 10px 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; cursor: pointer; border-radius: 2px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { border: 1px solid #eee; padding: 20px; border-radius: 4px; background: #fff; }
        .product-img-box { width: 100%; height: 350px; background: #f7f7f7; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 15px; border-radius: 2px; }
        .product-title { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .product-price-info { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .price-row { font-size: 1.1rem; font-weight: 800; color: #000; }
        .installment-row { font-size: 0.75rem; color: #00b050; font-weight: 600; }
        
        /* SISTEMA DE ESTRELLAS Y RESEÑAS */
        .stars-container { display: flex; gap: 30px; align-items: center; margin-bottom: 15px; font-size: 0.8rem; color: #666; }
        .stars { color: #ffb703; font-size: 1rem; }
        .order-button { width: 100%; background: #000; color: #fff; border: none; padding: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; margin-bottom: 20px; border-radius: 2px; }
        .order-button:hover { background: #ff4500; }

        /* SECCIÓN COMENTARIOS */
        .reviews-section { border-top: 1px solid #f0f0f0; padding-top: 15px; }
        .reviews-section h5 { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: #333; }
        .comments-list { max-height: 120px; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .comment-item { font-size: 0.75rem; color: #555; background: #f9f9f9; padding: 8px 12px; margin-bottom: 6px; border-radius: 4px; line-height: 1.4; }
        .comment-item strong { color: #000; }
        
        .review-input-box { display: flex; gap: 8px; }
        .review-input-box input { flex: 1; padding: 8px 12px; font-size: 0.75rem; border: 1px solid #ddd; border-radius: 2px; outline: none; }
        .review-input-box button { background: #000; color: #fff; border: none; padding: 0 15px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: pointer; border-radius: 2px; }

        /* VENTANAS MODALES */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; display: none; }
        .info-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 40px; border-radius: 4px; width: 90%; max-width: 450px; z-index: 1001; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .info-modal h3 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-modal p { font-size: 0.8rem; color: #555; line-height: 1.6; margin-bottom: 10px; }
        .close-modal-btn { background: #000; color: #fff; border: none; padding: 8px 16px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 15px; width: 100%; border-radius: 2px; }

        footer { background: #fbfbfb; border-top: 1px solid #eee; text-align: center; padding: 40px 20px; font-size: 0.7rem; font-weight: 600; color: #999; letter-spacing: 1px; text-transform: uppercase; margin-top: 80px; }
        footer a { color: #111; text-decoration: none; margin: 0 10px; }
        footer a:hover { color: #ff4500; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="info-modal" id="infoModal">
        <h3 id="modalTitle">Título</h3>
        <div id="modalBody">Contenido</div>
        <button class="close-modal-btn" onclick="closeModal()">Entendido</button>
    </div>

    <!-- HEADER SUPERIOR -->
    <header>
        <div class="top-banner">3 Y 6 CUOTAS SIN INTERÉS • ENVÍOS NRE / NACIONALES</div>
        <div class="navbar">
            <ul class="nav-links">
                <li><button onclick="openModal('menu')">Menú</button></li>
                <li><button onclick="openModal('buscar')">Buscar</button></li>
            </ul>
            <a href="#" class="logo" onclick="showHome()">DETEX<span>.</span></a>
            <ul class="nav-links">
                <li><button onclick="openModal('tallas')">Tallas</button></li>
                <li><button onclick="openModal('faq')">Preguntas Frecuentes</button></li>
            </ul>
        </div>
    </header>

    <div class="main-container">
        
        <!-- VISTA DE INICIO (ESTILO DOCTA) -->
        <div id="home-view">
            <div class="hero-banner">
                <!-- Imagen limpia placeholder simulando el banner superior de Docta -->
                <div style="width: 100%; height: 280px; background: #222; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; text-transform:uppercase; border-radius:4px;">
                    <h2 style="font-size: 2.2rem; font-weight:900; letter-spacing:4px;">LO MEJOR PARA TU ESTILO</h2>
                    <p style="font-size:0.8rem; color:#aaa; letter-spacing:2px; margin-top:10px;">Mayorista Oficial • Streetwear</p>
                </div>
            </div>

            <div class="section-title">Categorías Mayoristas</div>
            
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('pantalones')">
                    <div class="category-bg-text">Pantalones</div>
                    <div class="category-subtitle">Baggys / Jeans / Cargos</div>
                </div>
                <div class="category-card" onclick="openCategory('remeras')">
                    <div class="category-bg-text">Remeras</div>
                    <div class="category-subtitle">Oversized / Estampadas</div>
                </div>
                <div class="category-card" onclick="openCategory('buzos')">
                    <div class="category-bg-text">Buzos</div>
                    <div class="category-subtitle">Abrigos / Frizados</div>
