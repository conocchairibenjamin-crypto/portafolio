<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vital Fitness - PWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --color-primary: #10b981;
      --color-primary-glow: rgba(16, 185, 129, 0.4);
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .neon-border {
      border: 1px solid var(--color-primary);
      box-shadow: 0 0 12px var(--color-primary-glow);
    }
    .neon-btn {
      background: var(--color-primary);
      box-shadow: 0 0 15px var(--color-primary-glow);
    }
    .glass-card {
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24">

  <!-- BARRA SUPERIOR RAPIDA -->
  <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/50 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full neon-btn flex items-center justify-center font-black text-black text-sm">VF</div>
      <div>
        <h1 class="text-sm font-bold tracking-wide leading-none text-white">VITAL FITNESS</h1>
        <p class="text-[10px] text-zinc-400 mt-0.5">Prof. Carina Tisera</p>
      </div>
    </div>
    <button onclick="switchView('admin')" class="px-2.5 py-1 text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg border border-zinc-700 font-medium">
      <i class="fa-solid fa-user-shield mr-1"></i> Admin Panel
    </button>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="app-content" class="max-w-md mx-auto px-4 pt-4">

    <!-- SECCIÓN: INICIO / MI PERFIL (MODO ALUMNA) -->
    <div id="view-inicio" class="space-y-4">
      
      <!-- ESTADO DE PASE -->
      <div class="glass-card rounded-2xl p-4 neon-border relative overflow-hidden">
        <div class="flex justify-between items-start mb-2">
          <div>
            <span class="text-[10px] font-bold tracking-widest text-emerald-400 uppercase">Membresía Activa</span>
            <h2 class="text-xl font-black text-white mt-0.5">Desafío GAP HIIT</h2>
          </div>
          <span class="px-2 py-0.5 text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full">Activo</span>
        </div>
        <p class="text-xs text-zinc-400 mb-3">Sede Justiniano Posse • Francisco Ramírez 24</p>
        
        <div class="grid grid-cols-2 gap-2 text-xs bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800">
          <div>
            <span class="text-zinc-500 text-[10px] block">Vencimiento</span>
            <strong class="text-zinc-200">30 Días restantes</strong>
          </div>
          <div>
            <span class="text-zinc-500 text-[10px] block">Meta semanal</span>
            <strong class="text-emerald-400">4 / 4 Clases</strong>
          </div>
        </div>

        <button onclick="abrirModalPago()" class="w-full mt-3 py-2 text-xs font-bold text-black neon
