<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETEX — Official Streetwear Shop</title>
    <style>
        @import url('https://googleapis.com');
        
        /* ESTILO DOCTA / WESS - CURSOR NATIVO FLUIDO */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: #ffffff; color: #000000; overflow-x: hidden; }

        /* NAVBAR FIJA */
        header { border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; background: #ffffff; z-index: 100; }
        .top-banner { background: #000000; color: #ffffff; text-align: center; padding: 10px; font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; max-width: 1400px; margin: 0 auto; }
        .nav-left, .nav-right { display: flex; gap: 30px; }
        .nav-btn { background: none; border: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; color: #000; }
        .nav-btn:hover { color: #ff4500; }
        .logo { font-size: 1.7rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-decoration: none; color: #000; }
        .logo span { color: #ff4500; }
        .cart-indicator { background: #000; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-family: 'Inter', sans-serif; }

        /* MENÚ LATERAL EXACTO A WESS */
        .wess-menu { position: fixed; top: 0; left: -360px; width: 340px; height: 100vh; background: #ffffff; border-right: 1px solid #000; z-index: 1000; padding: 50px 35px; transition: 0.4s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .wess-menu.active { left: 0; }
        .close-wess { font-size: 1.5rem; font-weight: 500; text-align: right; cursor: pointer; margin-bottom: 40px; color: #000; }
        .wess-list { list-style: none; display: flex; flex-direction: column; gap: 18px; }
        .wess-list li a { color: #000; text-decoration: none; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
        .wess-list li a:hover { color: #ff4500; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); z-index: 998; display: none; }
        .menu-overlay.active { display: block; }

        /* CONTENEDOR DE LA LANDING */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 30px 4%; }
        
        /* BOX PRINCIPAL CON EL LOGO / FOTO DE LA CHICA EN MOVIMIENTO */
        .hero-banner-real { width: 100%; height: 350px; background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://unsplash.com') no-repeat center center/cover; border-radius: 4px; margin-bottom: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        .hero-banner-real h2 { font-size: 2.5rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero-banner-real p { font-size: 0.85rem; color: #fff; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* CATEGORÍAS EN BLOQUES CUADRADOS CON FOTOS PREMIUM */
        .section-title { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 35px; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 60px; }
        
        .category-card { position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; border: 1px solid #eee; transition: 0.3s; background-size: cover; background-position: center; }
        .category-card:hover { transform: translateY(-3px); border-color: #000; }
        .category-card::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.1); transition: 0.3s; }
        .category-card:hover::before { background: rgba(0,0,0,0.15); }
        
        .cat-text { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; color: #000; z-index: 2; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
        .cat-sub { position: absolute; bottom: 20px; font-size: 0.75rem; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 1px; z-index: 2; text-shadow: 0 0 5px rgba(255,255,255,0.8); }

        /* BARRA DE BÚSQUEDA */
        .search-container-box { background: #f9f9f9; border: 1px solid #eee; padding: 25px; border-radius: 4px; margin-bottom: 40px; display: none; }
        .search-container-box.active { display: block; }
        .search-flex { display: flex; gap: 10px; }
        .search-flex input { flex: 1; padding: 12px 20px; font-size: 0.9rem; border: 1px solid #ddd; outline: none; }
        .search-flex button { background: #000; color: #fff; border: none; padding: 0 25px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }

        /* INTERFAZ DEL CATÁLOGO DESPLEGABLE */
        .catalog-section { display: none; }
        .catalog-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .back-link { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #000; text-decoration: none; cursor: pointer; margin-bottom: 30px; display: inline-block; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { border: 1px solid #eee; padding: 20px; border-radius: 4px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img-frame { width: 100%; height: 340px; background-size: cover; background-position: center; margin-bottom: 15px; border-radius: 2px; border: 1px solid #f2f2f2; display: flex; align-items: flex-end; padding: 15px; }
        .model-tag { background: rgba(0,0,0,0.8); color: #fff; font-size: 0.65rem; padding: 4px 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .p-name { font-size: 1rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .p-desc { font-size: 0.75rem; color: #666; font-family: 'Inter', sans-serif; line-height: 1.4; margin-bottom: 12px; }
        .price-box { font-size: 1.2rem; font-weight: 900; color: #000; }
        .quota-box { font-size: 0.75rem; color: #00b050; font-weight: 600; font-family: 'Inter', sans-serif; }
        
        .card-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #f5f5f5; padding-top: 15px; }
        .stars-box { font-size: 0.75rem; color: #666; }
        .stars-box span { color: #ffb703; font-size: 0.9rem; }
        
        /* BOTÓN MAS (+) REQUERIDO */
        .add-cart-btn { background: #000000; color: #ffffff; border: none; width: 38px; height: 38px; font-size: 1.4rem; font-weight: 400; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; }
        .add-cart-btn:hover { background: #ff4500; }

        /* RESEÑAS Y COMENTARIOS */
        .reviews-wrapper { border-top: 1px solid #f5f5f5; margin-top: 15px; padding-top: 15px; font-family: 'Inter', sans-serif; }
        .reviews-title { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #333; margin-bottom: 8px; }
        .reviews-box { max-height: 90px; overflow-y: auto; margin-bottom: 10px; }
        .review-msg { font-size: 0.7rem; color: #555; background: #fcfcfc; padding: 6px 10px; margin-bottom: 5px; border-radius: 2px; border: 1px solid #f8f8f8; }
        .review-input-group { display: flex; gap: 6px; }
        .review-input-group input { flex: 1; padding: 6px 10px; font-size: 0.7rem; border: 1px solid #ddd; outline: none; }
        .review-input-group button { background: #000; color: #fff; border: none; padding: 0 12px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }

        /* TABLA DE TALLES DE WESS */
        .wess-table-container { margin-top: 10px; }
        .wess-table-title { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; text-align: center; margin-bottom: 5px; }
        .wess-table-sub { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; text-align: center; color: #666; margin-bottom: 20px; }
        .wess-section-label { font-size: 0.95rem; font-weight: 900; text-transform: uppercase; margin: 15px 0 10px 0; border-left: 3px solid #000; padding-left: 8px; }
        .wess-grid-table { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #000; text-align: center; font-size: 0.8rem; margin-bottom: 15px; }
        .wess-th { background: #000; color: #fff; font-weight: 800; padding: 8px; text-transform: uppercase; }
        .wess-td { padding: 8px; border-bottom: 1px solid #eee; font-weight: 600; border-right: 1px solid #eee; }
        .wess-td:last-child { border-right: none; }

        /* MODALES GENERALES */
        .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 2000; display: none; }
